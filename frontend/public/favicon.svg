<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="dokanlyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#7f1d1d" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Dokanly Brand Red Rounded Square -->
  <rect width="64" height="64" rx="16" fill="url(#dokanlyGrad)"/>

  <!-- Shopping Bag Handle -->
  <path d="M23 22V15C23 10.0294 27.0294 6 32 6C36.9706 6 41 10.0294 41 15V22" 
        stroke="#ffffff" 
        stroke-width="4.5" 
        stroke-linecap="round" />

  <!-- Shopping Bag Body -->
  <rect x="13" y="21" width="38" height="36" rx="7" fill="#ffffff" filter="url(#shadow)"/>

  <!-- Dokanly Signature Smile Accent -->
  <path d="M25 34C28.5 39 35.5 39 39 34" 
        stroke="#dc2626" 
        stroke-width="3.5" 
        stroke-linecap="round" />

  <!-- Gold Star Accent -->
  <circle cx="45" cy="18" r="2.5" fill="#fbbf24" />
</svg>
